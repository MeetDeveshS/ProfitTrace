<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <rect width="360" height="360" rx="48" fill="#1F2421" />

  <g transform="translate(20, 20)">
    <!-- Ground ellipse -->
    <ellipse cx="170" cy="275" rx="130" ry="12" fill="#2E3731" />

    <!-- Backdrop organic circle/egg shape -->
    <path d="M 100 250 C 60 215, 50 125, 110 80 C 160 45, 245 55, 260 115 C 275 175, 250 235, 200 258 C 160 270, 125 265, 100 250 Z" fill="#2B352E" />

    <!-- Sprout leaves on bottom-left -->
    <g fill="#93BD8C">
      <path d="M 45 260 Q 60 225 68 205" stroke="#7BA674" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 48 225 C 30 220, 20 200, 38 195 C 50 190, 58 212, 48 225 Z" />
      <path d="M 58 212 C 72 200, 82 208, 78 222 C 72 232, 60 224, 58 212 Z" />
      <path d="M 64 198 C 58 178, 78 172, 84 190 C 86 202, 72 205, 64 198 Z" />
    </g>

    <!-- Upward arrow -->
    <path d="M 150 195 Q 200 125 260 75" stroke="#F4F8F1" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 245 68 L 268 72 L 262 96 Z" fill="#F4F8F1" />

    <!-- Bar Chart Bars in Pista Green -->
    <rect x="160" y="195" width="24" height="65" rx="3" fill="#A4CC9E" />
    <rect x="190" y="155" width="24" height="105" rx="3" fill="#A4CC9E" />
    <rect x="220" y="115" width="24" height="145" rx="3" fill="#A4CC9E" />

    <!-- Dollar Symbol ($) on the left -->
    <g transform="translate(80, 80)">
      <path d="M 42 10 L 42 165" stroke="#A4CC9E" stroke-width="14" stroke-linecap="round" />
      <path d="M 68 38 C 64 22, 52 18, 38 18 C 20 18, 8 28, 8 44 C 8 62, 24 70, 46 76 C 70 82, 78 94, 78 114 C 78 136, 62 148, 38 148 C 16 148, 4 136, 2 118" 
            stroke="#A4CC9E" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Coin Stack -->
    <g transform="translate(195, 205)">
      <g fill="#A4CC9E" stroke="#7BA674" stroke-width="1.5">
        <rect x="40" y="8" width="36" height="8" rx="3" />
        <rect x="40" y="18" width="36" height="8" rx="3" />
        <rect x="40" y="28" width="36" height="8" rx="3" />
        <rect x="40" y="38" width="36" height="8" rx="3" />
      </g>
      <circle cx="28" cy="32" r="26" fill="#1F2421" stroke="#A4CC9E" stroke-width="3.5" />
      <text x="28" y="41" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#A4CC9E" text-anchor="middle">$</text>
    </g>
  </g>
</svg>
