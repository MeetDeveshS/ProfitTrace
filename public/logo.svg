<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Illustration Group -->
  <g transform="translate(40, 20)">
    <!-- Ground ellipse -->
    <ellipse cx="210" cy="305" rx="160" ry="14" fill="#E8EFE5" />

    <!-- Backdrop soft organic circle/egg shape -->
    <path d="M 120 280 C 70 240, 60 140, 130 90 C 190 50, 290 60, 310 130 C 330 200, 300 270, 240 295 C 190 310, 150 300, 120 280 Z" fill="#F4F8F1" />

    <!-- Small sprout leaves on bottom-left -->
    <g fill="#93BD8C">
      <!-- Stem -->
      <path d="M 60 290 Q 75 250 82 230" stroke="#7BA674" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Left Leaf -->
      <path d="M 62 250 C 40 245, 30 220, 50 215 C 65 210, 75 235, 62 250 Z" />
      <!-- Right Leaf -->
      <path d="M 72 235 C 90 220, 100 230, 95 248 C 88 260, 75 250, 72 235 Z" />
      <!-- Top Leaf -->
      <path d="M 78 220 C 70 195, 95 190, 100 210 C 102 225, 88 230, 78 220 Z" />
    </g>

    <!-- Upward arrow curving out behind the bars -->
    <path d="M 190 220 Q 250 140 325 80" stroke="#1F2421" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 305 70 L 335 75 L 328 105 Z" fill="#1F2421" />

    <!-- Bar Chart Bars in Pista Green -->
    <!-- Bar 1 (Short) -->
    <rect x="200" y="215" width="30" height="75" rx="4" fill="#A4CC9E" />
    <!-- Bar 2 (Medium) -->
    <rect x="238" y="170" width="30" height="120" rx="4" fill="#A4CC9E" />
    <!-- Bar 3 (Tall) -->
    <rect x="276" y="125" width="30" height="165" rx="4" fill="#A4CC9E" />

    <!-- Large Bold Dollar Symbol ($) on the left -->
    <g transform="translate(100, 90)">
      <!-- Vertical Dollar Bar -->
      <path d="M 52 10 L 52 195" stroke="#A4CC9E" stroke-width="18" stroke-linecap="round" />
      <!-- Stylized Dollar S curve -->
      <path d="M 85 45 C 80 25, 65 20, 48 20 C 25 20, 10 32, 10 52 C 10 75, 30 84, 58 92 C 88 100, 98 114, 98 138 C 98 165, 78 180, 48 180 C 20 180, 5 165, 2 142" 
            stroke="#A4CC9E" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stack of Coins with Front Dollar Coin -->
    <g transform="translate(245, 230)">
      <!-- Back stacked coins -->
      <g fill="#A4CC9E" stroke="#7BA674" stroke-width="2">
        <rect x="50" y="8" width="45" height="10" rx="4" />
        <rect x="50" y="20" width="45" height="10" rx="4" />
        <rect x="50" y="32" width="45" height="10" rx="4" />
        <rect x="50" y="44" width="45" height="10" rx="4" />
      </g>
      <!-- Front Circular Coin with Dollar Sign -->
      <circle cx="36" cy="38" r="32" fill="#1F2421" stroke="#A4CC9E" stroke-width="4" />
      <circle cx="36" cy="38" r="27" fill="#1F2421" stroke="#7BA674" stroke-width="1.5" stroke-dasharray="3 2" />
      <text x="36" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#A4CC9E" text-anchor="middle">$</text>
    </g>

    <!-- Sparkle accents -->
    <path d="M 95 105 L 98 112 L 105 115 L 98 118 L 95 125 L 92 118 L 85 115 L 92 112 Z" fill="#7BA674" />
    <path d="M 345 195 L 347 200 L 352 202 L 347 204 L 345 209 L 343 204 L 338 202 L 343 200 Z" fill="#7BA674" />
  </g>

  <!-- Right Typography: PROFIT TRACE -->
  <g transform="translate(425, 110)">
    <!-- PROFIT Text (Bold Hand-Crafted Stencil Style) -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="78" font-weight="900" letter-spacing="2" fill="#1F2421">
      PROFIT
    </text>

    <!-- TRACE Text (Distinctive Pista Green) -->
    <text x="5" y="165" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="96" font-weight="900" letter-spacing="4" fill="#9BC894">
      TRACE
    </text>
  </g>
</svg>
